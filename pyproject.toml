[project]
name = "lazydata"
version = "0.1.0"
description = "Im too lazy."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "jaxtyping>=0.3.11",
    "numpy>=2.5.0",
    "plotly>=6.8.0",
    "polars>=1.42.0",
    "rich>=15.0.0",
    "torch==2.7.1",
]

[tool.uv]
package = true

[dependency-groups]
cml = ["clearml>=2.1.9"]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "ty>=0.0.59",
]


[tool.ruff]
line-length=120

[tool.ruff.lint]
select=["F","UP","B","ANN","SIM","NPY"]
